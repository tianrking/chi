name: Charset native green validation
on:
  push:
    branches: [codex/charset-native-final]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        go: [1.24.x, 1.25.x, 1.26.x, 1.27.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 35fea3e25b3e1e02f154fc5bd4213070b309ad15
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Record exact native source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          git rev-parse HEAD:middleware/content_charset.go > artifacts/production-blob.txt
          git rev-parse HEAD:middleware/content_charset_test.go > artifacts/test-blob.txt
          test "$(cat artifacts/source-sha.txt)" = 35fea3e25b3e1e02f154fc5bd4213070b309ad15
          test "$(cat artifacts/test-blob.txt)" = 7d90b04bd596265d37e1f07bcb1cea6448e45a10
          sha256sum middleware/content_charset.go middleware/content_charset_test.go > artifacts/source-before.sha256
          git hash-object --path=middleware/content_charset.go middleware/content_charset.go > artifacts/worktree-production-before.blob
          git hash-object --path=middleware/content_charset_test.go middleware/content_charset_test.go > artifacts/worktree-test-before.blob
          test "$(cat artifacts/worktree-production-before.blob)" = 59a774dd53b5117b86ab936298b901ed81414173
          test "$(cat artifacts/worktree-test-before.blob)" = 7d90b04bd596265d37e1f07bcb1cea6448e45a10
          git diff --exit-code HEAD --
          git status --porcelain --untracked-files=no > artifacts/tracked-status-before.txt
          test ! -s artifacts/tracked-status-before.txt
          git diff --exit-code 9553bd4cd1b1ded136518fa834ebee1149be5e0d -- middleware/content_charset_test.go
          go version > artifacts/go-version.txt
          go env GOVERSION GOOS GOARCH > artifacts/go-environment.txt
      - name: Frozen regressions with race detector
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -race -json ./middleware -run '^TestContentCharsetMediaParameters' 2>&1 | tee artifacts/focused.jsonl
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > artifacts/focused.exit
          test "$result" -eq 0
      - name: Official full make test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          make test 2>&1 | tee artifacts/make-test.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > artifacts/make-test.exit
          test "$result" -eq 0
      - name: Full vet
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go vet ./... 2>&1 | tee artifacts/vet.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > artifacts/vet.exit
          test "$result" -eq 0
      - name: Scoped goimports
        if: matrix.os == 'ubuntu-24.04' && matrix.go == '1.24.x'
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.31.0
          "$(go env GOPATH)/bin/goimports" -l middleware/content_charset.go middleware/content_charset_test.go > artifacts/goimports.txt
          test ! -s artifacts/goimports.txt
      - name: Verify tested working files after all checks
        shell: bash
        run: |
          set -euo pipefail
          sha256sum middleware/content_charset.go middleware/content_charset_test.go > artifacts/source-after.sha256
          git hash-object --path=middleware/content_charset.go middleware/content_charset.go > artifacts/worktree-production-after.blob
          git hash-object --path=middleware/content_charset_test.go middleware/content_charset_test.go > artifacts/worktree-test-after.blob
          git rev-parse HEAD > artifacts/source-after-sha.txt
          sha256sum -c artifacts/source-before.sha256 | tee artifacts/source-after-check.log
          test "$(cat artifacts/worktree-production-after.blob)" = 59a774dd53b5117b86ab936298b901ed81414173
          test "$(cat artifacts/worktree-test-after.blob)" = 7d90b04bd596265d37e1f07bcb1cea6448e45a10
          test "$(cat artifacts/source-after-sha.txt)" = 35fea3e25b3e1e02f154fc5bd4213070b309ad15
          git diff --exit-code HEAD -- > artifacts/tracked-diff-after.patch
          git status --porcelain --untracked-files=no > artifacts/tracked-status-after.txt
          test ! -s artifacts/tracked-status-after.txt
      - name: Hash native evidence
        if: always()
        shell: bash
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charset-green-${{ matrix.os }}-${{ matrix.go }}
          path: artifacts/
